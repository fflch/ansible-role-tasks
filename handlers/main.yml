---
- name: restart apache2
  service:
    name: apache2
    state: restarted

- name: restart bind9
  service:
    name: bind9
    state: restarted

- name: restart vsftpd
  service:
    name: vsftpd
    state: restarted

- name: Recarregar systemd
  ansible.builtin.systemd_service:
    daemon_reload: yes

- name: Restart garage
  ansible.builtin.systemd:
    name: garage
    state: restarted
