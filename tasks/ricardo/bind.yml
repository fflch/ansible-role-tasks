- name: Install a list of packages
  apt:
    pkg:
    - dnsutils
    - bind9
    - curl

- name: cria os diretórios "keys, master, slave"
  file:
    path: "/var/cache/bind/{{ item }}"
    state: directory
    recurse: yes
    owner: bind
    group: bind
  with_items:
    - keys
    - master
    - slave

- name: copia named.conf.options
  template:
    src: 'bind/named.conf.options.j2'
    dest: '/etc/bind/named.conf.options'
    owner: root
    group: bind
    mode: 0644

- name: copia named.conf.default-zones
  template:
    src: 'bind/named.conf.default-zones.j2'
    dest: '/etc/bind/named.conf.default-zones'
    owner: root
    group: bind
    mode: 0644

- name: obtêm o valor do rndc.key
  slurp:
    src: /etc/bind/rndc.key
  register: rndc

- name: copia o valor do register rndc para o named.conf.options
  blockinfile:
    path: /etc/bind/named.conf.options
    insertbefore: '^controls\s{'
    block: "{{ rndc['content'] | b64decode }}"

- name: Copy /var/cache/bind/keys
  copy:
    src: "{{ tasks_bind_files_dir }}/keys/"
    dest: /var/cache/bind/keys
    mode: '0644'

- name: copy /var/cache/bind/master/{{ tasks_bind_subdomain }}.rev
  template:
    src: 'bind/reverso.rev.j2'
    dest: '/var/cache/bind/master/{{ tasks_bind_subdomain }}.rev'
    owner: root
    group: bind
    mode: 0644

- name: copy /var/cache/bind/master/reverso.ip6.db.rev
  template:
    src: 'bind/reverso.ip6.db.rev.j2'
    dest: "/var/cache/bind/master/{{task_bind_rev_ip6}}.ip6.db.rev"
    owner: root
    group: bind
    mode: 0644

- name: Create links
  file:
    src: '/var/cache/bind/{{ item }}'
    dest: '/etc/bind/{{ item}}'
    state: link
  loop:
    - keys
    - master
    - slave

- name: cria diretório /var/log/named
  file:
    dest: "/var/log/named"
    recurse: yes
    state: directory
    owner: bind
    group: bind
  notify:
    - restart bind9

- name: cria diretórios do build-zone-records
  file:
    dest: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: 0700
  loop:
    - /etc/build-zone-records
    - /var/lib/build-zone-records

- name: instala o comando build-zone-records
  template:
    src: "bind/build-zone-records.j2"
    dest: "/usr/local/bin/build-zone-records"
    owner: root
    group: root
    mode: 0700

- name: copia o cabeçalho da zona
  template:
    src: "bind/head.j2"
    dest: "/etc/build-zone-records/head.txt"
    owner: root
    group: root
    mode: 0600

- name: copia domínios fixos e URLs dos domínios dinâmicos
  copy:
    src: "{{ tasks_bind_files_dir }}/{{ item }}"
    dest: "/etc/build-zone-records/{{ item }}"
    owner: root
    group: root
    mode: 0600
  loop:
    - domains.txt
    - url_clients.txt

- name: roda build-zone-records a cada 5 minutos
  cron:
    name: "build_zone_records"
    minute: "*/5"
    job: "/usr/local/bin/build-zone-records"
    user: root
